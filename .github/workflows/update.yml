name: Update curriculum

# Runs only by hand: Actions -> "Update curriculum" -> Run workflow, then type the subject.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: "اسم المادة زي ما هو في البرنامج (مثلاً: الرياضيات، العلوم، اللغة العربية)، أو all لكل المواد"
        required: true
        default: "الرياضيات"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic pypdf requests
      - run: python scripts/update.py "$SUBJECT"
        env:
          SUBJECT: ${{ inputs.subject }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update curriculum: $SUBJECT"; git push; }
        env:
          SUBJECT: ${{ inputs.subject }}
